<script>
const FPS=30,BEAT=0.5,TOT=17.5;

 ['हिन्दी','नमस्ते','hindi','NDe'],['中文','你好','mandarim','NSC'],['日本語','こんにちは','japonês','NJP'],['한국어','안녕하세요','coreano','NKR']];
const BG=[['#FF9A2E','#F2711C'],['#8A5CE6','#5B33B8'],['#22B573','#128A55'],['#FF7A66','#E5503C'],['#F07AB8','#C9488F'],['#14264F','#081226']];

const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);
const eoE=p=>p>=1?1:1-Math.pow(2,-10*p), eiE=p=>p<=0?0:Math.pow(2,10*p-10);
const eio=p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;
const bk=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
// ---------- cenas ----------
const SC=[]; const host=$('scenes');
function mk(cls){const d=document.createElement('div');d.className=cls;return d}
function layer(sc,name,z){const l=mk('ly');l.style.zIndex=z;sc.appendChild(l);sc[name]=l;return l}
function addCircles(l,c){l.innerHTML=`<div class="ly" style="background:linear-gradient(170deg,${c[0]},${c[1]})"></div><div class="circ" style="width:1000px;height:1000px;left:-340px;top:260px"></div><div class="circ" style="width:1100px;height:1100px;left:380px;top:1000px"></div>`}
function feathers(l,seed,n=11){const r=rng(seed);const cols=['#2457E6','#22B5A8','#FFC83D','#22B573'];let h='';for(let i=0;i<n;i++){const c=cols[Math.floor(r()*4)];const s=60+r()*90;h+=`<svg class="fe" data-x="${r()*1080}" data-y="${r()*2200}" data-v="${40+r()*70}" data-r="${r()*360}" data-w="${(r()-.5)*90}" data-b="${i%3==0?0:1}" width="${s*.5}" height="${s}" viewBox="-20 -150 40 150" style="position:absolute;left:0;top:0"><path d="M0,0 C22,-32 30,-95 0,-148 C-30,-95 -22,-32 0,0Z" fill="${c}"/><path d="M0,0 L0,-140" stroke="rgba(255,255,255,.55)" stroke-width="2"/></svg>`}
 for(let i=0;i<8;i++){const s=40+r()*110;h+=`<div class="fe" data-x="${r()*1080}" data-y="${r()*2200}" data-v="${30+r()*50}" data-r="0" data-w="0" data-b="2" style="position:absolute;left:0;top:0;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)"></div>`}
 l.innerHTML=h}
function mkRara(sc,kind,key){const w=kind==='bust'?BUSTW*k0:FD[key][0]*RH/FD[key][1];const e=mk('rr');e.style.cssText=`left:${540-w/2}px;top:${RB-RH}px;width:${w}px;height:${RH}px;`;
 if(kind==='bust'){KS.forEach(k=>{const i=new Image();i.src='../recortes/K/'+k+'.png';i.dataset.k=k;e.appendChild(i)});e.style.webkitMaskImage='linear-gradient(180deg,#000 0,#000 90%,transparent 100%)'}
 else{const i=new Image();i.src='../recortes/'+key+'.png';i.style.visibility='visible';e.appendChild(i)}
 sc.rara=e;sc.rkind=kind;sc.ly3.appendChild(e);return e}
function buildLang(i){const sc=mk('sc');const [w,g,sub,font]=L[i];sc.kind='lang';sc.idx=i;sc.font=font;
 const bgc=i<4?BG[i]:BG[((i-4)%6)];sc.bgc=bgc;
 const lb=layer(sc,'ly0',1);addCircles(lb,bgc);
 const lf=layer(sc,'ly1',2);const rows=[0,1,2,3,4].map(r=>`<div class="row" data-d="${r%2?1:-1}" data-b="${(r*173)%420}" style="top:${150+r*262}px;font-size:${font==='NSC'||font==='NJP'||font==='NKR'?230:215}px;line-height:260px;font-family:'${font}','Nunito';direction:${font==='NAr'||font==='NHe'?'rtl':'ltr'}">${(`<span>${w}</span>`).repeat(8)}</div>`).join('');
 lf.innerHTML=`<div style="position:absolute;inset:0;opacity:.25;filter:blur(9px);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 1020px,transparent 1130px)">${rows}</div>`;
 const lm=layer(sc,'ly2',3);const fs=clamp(1000/(w.length*.64),150,430);sc.midfs=fs;
 lm.innerHTML=`<div class="mid" style="top:${560-fs*.55}px;font-size:${fs}px;line-height:${fs*1.1}px;opacity:.42;filter:blur(2.5px);font-family:'${font}','Nunito';-webkit-mask-image:linear-gradient(180deg,#000 0,#000 900px,transparent 1100px)">${[...w].map((c,k)=>`<span data-c="${c}">${c}</span>`).join('')}</div>`;
 layer(sc,'ly3',4);
 const rk=FULL[i]?'full':'bust'; mkRara(sc,rk,FULL[i]);
 const lq=layer(sc,'ly4',5);feathers(lq,100+i);
 const cap=layer(sc,'cap',6);cap.innerHTML=`<div class="cap g" id="g${i}" style="top:1186px;font-size:124px;line-height:1.08;font-family:'${font}','Nunito'">${g}</div><div class="cap s" id="s${i}" style="top:1332px;font-size:60px;line-height:1.1">em ${sub}</div>`;
 host.appendChild(sc);SC.push(sc);return sc}
function mkEl(html){return html}
// título
const T=mk('sc');T.kind='title';
(function(){const bg=layer(T,'ly0',1);bg.innerHTML=`<div class="ly" style="background:radial-gradient(ellipse 80% 55% at 50% 45%,#16305f,#081226 70%)"></div><div class="circ" style="width:1100px;height:1100px;left:-380px;top:300px"></div><div class="circ" style="width:1000px;height:1000px;left:420px;top:900px"></div>`;
 const far=layer(T,'ly1',2);const ws=['hello','hola','bonjour','hallo','ciao','привет','你好','こんにちは','مرحبا','안녕하세요','नमस्ते','שלום'];far.innerHTML=ws.map((w,i)=>`<div style="position:absolute;left:${(i*331)%900-60}px;top:${130+(i*173)%1000}px;font-weight:900;font-size:${150+(i%4)*40}px;color:#fff;opacity:.17;filter:blur(8px);white-space:nowrap;font-family:'Nunito','NSC','NJP','NKR','NAr','NHe','NDe'">${w}</div>`).join('');
 layer(T,'ly3',3);
 const e=mk('rr');const w=BUSTW*k0;e.style.cssText=`left:${540-w/2}px;top:${RB-RH}px;width:${w}px;height:${RH}px;transform-origin:${EYE[0]*k0}px ${EYE[1]*k0}px;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 90%,transparent 100%)`;
 ['K00_x32','K03_x32'].forEach(k=>{const i=new Image();i.src='../recortes/K/'+k+'.png';i.dataset.k=k.slice(0,3);e.appendChild(i)});T.ly3.appendChild(e);T.rara=e;
 const f=layer(T,'ly4',4);feathers(f,7,9);
 const n=mk('ly');n.style.zIndex=6;n.innerHTML=`<div id="n16" class="mo" style="position:absolute;left:0;width:1080px;text-align:center;top:0;font-size:240px;line-height:1;color:#FFC83D;text-shadow:0 0 40px rgba(255,200,61,.55)">16</div><div id="nid" class="mo" style="position:absolute;left:0;width:1080px;text-align:center;top:1196px;font-size:150px;line-height:1.05;color:#fff;-webkit-text-stroke:0">${[...'IDIOMAS'].map(c=>`<span style="display:inline-block">${c}</span>`).join('')}</div>`;T.appendChild(n);T.nums=n;
 const gl=mk('ly');gl.id='eyeglow';gl.style.cssText='z-index:7;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 540px 930px,rgba(255,255,255,.95),rgba(255,230,160,.5) 18%,rgba(255,255,255,0) 40%)';T.appendChild(gl);T.glow=gl;
 host.appendChild(T);SC.push(T)})();
for(let i=0;i<16;i++)buildLang(i);
// boom
const BM=mk('sc');BM.kind='boom';(function(){const bg=layer(BM,'ly0',1);bg.innerHTML=`<div class="ly" style="background:radial-gradient(ellipse 85% 60% at 50% 42%,#4a2a8f,#1a1240 60%,#081226)"></div><div class="circ" style="width:1100px;height:1100px;left:-330px;top:350px"></div>`;
 const lt=layer(BM,'ly1',2);const chars=[];L.forEach(l=>{[...l[0]].slice(0,3).forEach(c=>chars.push([c,l[3]]))});
 lt.innerHTML=chars.map((c,i)=>`<div class="bl" data-i="${i}" style="position:absolute;left:0;top:0;font-weight:900;color:#fff;font-family:'${c[1]}','Nunito';white-space:nowrap;line-height:1">${c[0]}</div>`).join('');
 layer(BM,'ly3',3);mkRara(BM,'bust');layer(BM,'ly5',5);
 const lq=layer(BM,'ly4',4);feathers(lq,555,14);
 const cap=layer(BM,'cap',6);cap.innerHTML=`<div class="cap s" id="eur" style="top:1210px;font-size:96px;line-height:1.08;color:#fff;font-weight:900">${[...'e uma '].map(c=>`<span style="display:inline-block;white-space:pre">${c}</span>`).join('')}<span style="color:#FFC83D;display:inline-block">${[...'Rara'].map(c=>`<span style="display:inline-block">${c}</span>`).join('')}</span><span style="display:inline-block;white-space:pre"> só</span></div>`;
 BM.rara.style.left=(540-BUSTW*k0/2)+'px';host.appendChild(BM);SC.push(BM)})();
// end
const EN=mk('sc');EN.kind='end';(function(){const bg=layer(EN,'ly0',1);bg.innerHTML=`<div class="ly" style="background:#081226"></div><div class="circ" style="width:1000px;height:1000px;left:-340px;top:140px"></div><div class="circ" style="width:1000px;height:1000px;left:480px;top:900px"></div>`;
 layer(EN,'ly3',2);const e=mkRara(EN,'full','G06');e.style.top=(1110-RH)+'px';
 const lq=layer(EN,'ly4',4);feathers(lq,9001,10);
 const cap=layer(EN,'cap',6);cap.innerHTML=`<div class="cap" id="dom" style="top:1196px;font-size:84px;font-weight:900;color:#fff;line-height:1.1;-webkit-text-stroke:0">falearara.com</div><div class="cap mo" id="sol" style="top:1316px;font-size:100px;color:#FFC83D;line-height:1.1;-webkit-text-stroke:0">Solta o bico.</div><div class="ly" id="rings" style="z-index:7"></div>`;
 host.appendChild(EN);SC.push(EN)})();
// ---------- linha do tempo ----------
const idxT=SC.indexOf(T), idxL0=SC.indexOf(SC.find(s=>s.kind==='lang')), idxB=SC.indexOf(BM), idxE=SC.indexOf(EN);
const t0=[]; for(let i=0;i<SC.length;i++)t0[i]=0;
t0[idxT]=0; for(let i=0;i<4;i++)t0[idxL0+i]=3.0+i*1.0; for(let i=4;i<16;i++)t0[idxL0+i]=7.0+(i-4)*0.5; t0[idxB]=13.0; t0[idxE]=15.5;
const t1=[]; for(let i=0;i<SC.length;i++)t1[i]=(i+1<SC.length)?t0[i+1]:TOT; t1[idxB]=15.5;
const TR={}; // por cena de destino
TR[idxL0]={type:'punch',a:2.85,b:3.12};TR[idxL0+1]={type:'whip',a:3.95,b:4.25};TR[idxL0+2]={type:'zoomO',a:4.70,b:5.05};TR[idxL0+3]={type:'wordmask',a:5.78,b:6.28};TR[idxL0+4]={type:'roll',a:6.88,b:7.25};
for(let i=5;i<16;i++)TR[idxL0+i]={type:'iris',a:t0[idxL0+i]-0.02,b:t0[idxL0+i]+0.20};
TR[idxB]={type:'iris',a:12.98,b:13.30};TR[idxE]={type:'light',a:15.25,b:15.65};
// ---------- Rara ----------
function beatImpulse(t){const ph=(t%BEAT)/BEAT;return Math.exp(-ph*5)*Math.cos(ph*13)}
function raraTransform(sc,t,tl,opts={}){const r=sc.rara;if(!r)return;
 const d=beatImpulse(t); let sx=1+0.075*d, sy=1-0.075*d;
 const ent=clamp(tl/0.22); if(tl<0.22&&!opts.noent){const e=bk(ent);sx*=0.7+0.3*e*1+0.08*Math.sin(Math.PI*ent);sy*=0.55+0.45*e-0.08*Math.sin(Math.PI*ent)}
 const breath=1+0.012*Math.sin(t*2.6); const bob=Math.sin(t*3.1)*5;
 const rot=Math.sin(t*5.2)*1.4+(opts.rot||0);
 r.style.transform=`translate(${opts.dx||0}px,${bob+(opts.dy||0)}px) rotate(${rot}deg) scale(${sx*(opts.s||1)},${sy*breath*(opts.s||1)})`}
function pickK(sc,t,tl,mood){const beatPh=t%BEAT;let k=mood||'K00';
 if(sc.kind==='lang'&&beatPh<0.16)k=(sc.idx%2?'K01':'K02');
 const blinkAt=[0.9,1.9,3.1];const bt=(t*0.5)%2.0; if(bt>1.62&&bt<1.74)k='K03';
 sc.rara.querySelectorAll('img').forEach(i=>i.style.visibility=i.dataset.k===k?'visible':'hidden');return k}
// ---------- renderers ----------
function cam(sc,t,tl,dur,idx){const e=tl/dur;const ph=(t%BEAT)/BEAT;const sh=3*Math.exp(-ph*9);
 return{x:12*Math.sin(t*.9+idx)+sh*Math.sin(ph*80),y:8*Math.cos(t*.7+idx)+sh*Math.cos(ph*70),s:1+0.07*e,r:0.8*Math.sin(t*.6+idx)}}
function applyCam(sc,c,pm){const set=(l,p)=>{if(!l)return;l.style.transform=`translate(${c.x*p}px,${c.y*p}px) rotate(${c.r*p}deg) scale(${1+(c.s-1)*p})`};set(sc.ly0,pm[0]);set(sc.ly1,pm[1]);set(sc.ly2,pm[2]);set(sc.ly3,pm[3]);set(sc.ly4,pm[4])}
function featherStep(l,t){if(!l)return;l.querySelectorAll('.fe').forEach(f=>{const x=+f.dataset.x,y=+f.dataset.y,v=+f.dataset.v,r=+f.dataset.r,w=+f.dataset.w,b=+f.dataset.b;
 const px=((x-t*v*.4)%1280+1280)%1280-100, py=((y-t*v)%2300+2300)%2300-160;
 f.style.transform=`translate(${px}px,${py}px) rotate(${r+t*w}deg)`;f.style.filter=b===1?'blur(11px)':(b===2?'blur(14px)':'blur(0.8px)');f.style.opacity=b===2?.9:.8})}
function renderLang(sc,t){const i=sc.idx,ts=t0[SC.indexOf(sc)],tl=Math.max(t-ts,0),dur=t1[SC.indexOf(sc)]-ts;
 const c=cam(sc,t,tl,dur,i);applyCam(sc,c,[.15,.3,.6,1,1.8]);
 sc.ly1.querySelectorAll('.row').forEach(d=>{const dir=+d.dataset.d;d.style.transform=`translateX(${dir*(tl*340+(+d.dataset.b))-(dir>0?900:0)}px)`});
 featherStep(sc.ly4,t);
 const mood=sc.rkind==='bust'?(MOOD[(i-4+12)%12]||'K00'):null;if(sc.rkind==='bust')pickK(sc,t,tl,mood);
 raraTransform(sc,t,tl,{noent:i>=5});
 const cp=clamp((tl-0.04)/(i<4?0.18:0.10));const g=$('g'+i),s=$('s'+i);const sg=0.7+0.3*bk(cp);g.style.opacity=cp;g.style.transform=`scale(${sg})`;s.style.opacity=clamp((tl-0.1)/0.1);s.style.transform=`scale(${0.9+0.1*bk(clamp((tl-0.1)/0.14))})`}
function renderTitle(sc,t){
 // 0-1.5 olho; 1.5-3 pull-back
 const pb=clamp((t-1.5)/1.5),e=eio(pb);const sEye=10.4,sEnd=1;
 let S=sEye*(1+0.06*clamp(t/1.5))*(1-e)+sEnd*e; if(pb>0)S=Math.exp(Math.log(sEye*1.06)*(1-e));
 const eyeSc={x:540,y:930},eyeEnd={x:540-(540-EYE[0]*k0-(540-BUSTW*k0/2)),y:RB-RH+EYE[1]*k0};
 const ex=540-BUSTW*k0/2+EYE[0]*k0, ey=RB-RH+EYE[1]*k0;
 const tx=(eyeSc.x*(1-e)+ex*e)-ex, ty=(eyeSc.y*(1-e)+ey*e)-ey;
 const hand=1-clamp((t-1.5)/0.4);const rot=(Math.sin(t*7)*0.5+Math.sin(t*3.1)*0.8)*hand*1.2;
 sc.rara.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${S})`;
 sc.rara.style.filter=(S>2?'none':'drop-shadow(0 30px 34px rgba(0,0,0,.35))');
 const blink=(t>=0.56&&t<0.69);sc.rara.querySelectorAll('img').forEach(i=>i.style.visibility=(i.dataset.k===(blink?'K03':'K00'))?'visible':'hidden');
 // brilho após piscada
 const gp=clamp((t-0.69)/0.35);sc.glow.style.opacity=t>0.69?(1-gp)*0.85*(gp<1?1:0):0;
 // parallax camera
