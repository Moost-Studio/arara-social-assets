*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;width:1080px}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Nunito';color:#081226}

.bal{position:absolute;z-index:6;background:#fff;border-radius:46px;border-bottom:16px solid #B9CCF2;padding:30px 44px 28px;box-shadow:0 22px 44px rgba(0,0,0,.26);font-weight:900;font-size:62px;line-height:1.1;letter-spacing:-.01em;transform:rotate(-1deg)}
.decal{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Nunito';font-weight:900;font-size:46px;line-height:1;letter-spacing:.14em;color:rgba(255,255,255,.93);text-shadow:0 0 1px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.16);filter:blur(.22px);pointer-events:none}
.decal svg{width:.95em;height:.95em;stroke:rgba(255,255,255,.93);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1px rgba(0,0,0,.5))}
.decal::after{content:"";position:absolute;inset:-34px -46px;background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.16) 48%,rgba(255,255,255,0) 62%);-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 68%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 68%);pointer-events:none}
.cap{position:absolute;left:64px;right:64px;bottom:70px;z-index:7;background:#081226;border-radius:28px;padding:18px 26px;text-align:center;font-family:'Mochiy';text-transform:uppercase;font-size:56px;line-height:1.18;color:#fff}
.cap .y{color:#FFC83D}
.hl{background:linear-gradient(transparent 52%,#FFC83D 52%,#FFC83D 92%,transparent 92%);padding:0 6px}
.btn{width:104px;height:104px;border-radius:50%;background:#FFC83D;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(0,0,0,.22)}
.btn svg{width:54px;height:54px;stroke:#081226}
.tapepos{position:absolute;left:56px;top:70px;z-index:7}
.tapew{filter:drop-shadow(0 5px 7px rgba(0,0,0,.28));display:inline-block;transform:rotate(-4deg)}
.tape{display:inline-block;font-family:'Mochiy';text-transform:lowercase;font-size:40px;line-height:1;color:#081226;background:#FFC83D;padding:14px 42px 14px 38px;clip-path:polygon(1% 6%,0 28%,2% 52%,0 76%,1% 96%,99% 100%,100% 74%,98% 50%,100% 24%,98% 2%)}

<script>document.fonts.ready.then(()=>{
 const ns='http://www.w3.org/2000/svg';
 document.querySelectorAll('.s').forEach(st=>{
  st.querySelectorAll('.bal').forEach(b=>{
   const tip=b.dataset.tip.split(',').map(Number),x=b.offsetLeft,y=b.offsetTop,w=b.offsetWidth,h=b.offsetHeight;
   const bx=Math.min(Math.max(tip[0]-60,x+40),x+w-160);
   const pts=`${bx},${y+h-14} ${bx+90},${y+h-14} ${tip[0]},${tip[1]}`;
   let sv=st.querySelector('svg.t'); if(!sv){sv=document.createElementNS(ns,'svg');sv.setAttribute('class','t');sv.setAttribute('width',1080);sv.setAttribute('height',1350);sv.style.cssText='position:absolute;left:0;top:0;z-index:5';st.appendChild(sv)}
   const p=document.createElementNS(ns,'polygon');p.setAttribute('points',pts);p.setAttribute('fill','#fff');sv.appendChild(p);
  });
 }); window.__done=true;});</script>
