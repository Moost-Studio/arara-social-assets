<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:'Nunito';src:url('../_fontes/Nunito.ttf');font-weight:200 1000}
@font-face{font-family:'Mochiy';src:url('../_fontes/MochiyPopOne-Regular.ttf')}
*{box-sizing:border-box;margin:0;padding:0}
#post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Nunito';color:#081226;background:#F7861F}
.art{position:absolute;inset:0;background:url(../../lote13_posts/equipe_CE/CE01_v1.png) center/cover}
.lbl{position:absolute;left:64px;top:70px;z-index:8;display:flex;align-items:center;gap:16px;font-weight:900;font-size:34px;letter-spacing:.22em;text-transform:uppercase;color:#081226}
.lbl::after{content:'';width:56px;height:4px;border-radius:2px;background:currentColor}
.head{position:absolute;left:64px;top:128px;z-index:5;font-family:'Mochiy';font-size:70px;line-height:1.1;color:#081226;white-space:nowrap}
.head .y{background:linear-gradient(transparent 55%,#FFC83D 55%,#FFC83D 94%,transparent 94%);padding:0 6px;margin-left:-6px}
.card{position:absolute;left:64px;right:64px;top:915px;height:330px;z-index:6;background:#fff;border-radius:40px;border-bottom:14px solid #B9CCF2;box-shadow:0 24px 46px rgba(0,0,0,.26);padding:30px 40px 26px;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.card h3{font-family:'Mochiy';font-weight:400;font-size:40px;line-height:1.1;margin-bottom:14px}
.card h3 span{background:linear-gradient(transparent 55%,#FFC83D 55%,#FFC83D 94%,transparent 94%);padding:0 6px;margin-left:-6px}
.card li{list-style:none;font-weight:800;font-size:36px;line-height:1.22;margin-bottom:10px;padding-left:34px;position:relative}
.card li::before{content:'';position:absolute;left:0;top:15px;width:16px;height:16px;border-radius:50%;background:#2457E6}
.nope li::before{background:#FF6B57}
.name{position:absolute;right:64px;top:128px;z-index:5;font-weight:900;font-size:34px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body><div id="post">
<div class="art"></div>
<div class="lbl">Conheça a equipe</div>
<div class="head">Prazer, <span class="y">Rara</span></div>
<div class="card">
 <div><h3><span>gosta de</span></h3><ul><li>café</li><li>quando você tenta de novo</li><li>piada ruim</li></ul></div>
 <div class="nope"><h3>não gosta de</h3><ul><li>silêncio no microfone</li></ul></div>
</div>
</div></body></html>
