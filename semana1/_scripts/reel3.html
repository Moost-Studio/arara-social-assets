<script>
window.CLIPS=window.CLIPS||{};
const FPS=60,BEAT=0.5,TOT=17.5,DPR=window.devicePixelRatio||1;
const L=[
 ['ENGLISH','hello','inglês','Nunito'],['ESPAÑOL','hola','espanhol','Nunito'],['FRANÇAIS','bonjour','francês','Nunito'],['DEUTSCH','hallo','alemão','Nunito'],
 ['ITALIANO','ciao','italiano','Nunito'],['NEDERLANDS','hallo','holandês','Nunito'],['SVENSKA','hej','sueco','Nunito'],['POLSKI','cześć','polonês','Nunito'],
 ['РУССКИЙ','привет','russo','Nunito'],['TÜRKÇE','merhaba','turco','Nunito'],['العربية','مرحبا','árabe','NAr'],['עברית','שלום','hebraico','NHe'],
 ['हिन्दी','नमस्ते','hindi','NDe'],['中文','你好','mandarim','NSC'],['日本語','こんにちは','japonês','NJP'],['한국어','안녕하세요','coreano','NKR']];
const BG=[['#FF9A2E','#F2711C'],['#8A5CE6','#5B33B8'],['#22B573','#128A55'],['#FF7A66','#E5503C'],['#F07AB8','#C9488F'],['#14264F','#081226']];
// uma pose por idioma (poses variadas); EN, FR e o cartão final têm clipes de IA por cima
const POSE_OF=['C01','E01','E02','G06','G01','G09','G02','ARDENCIA','G07','E04','E06','E08','G10','C05_rara_asa_longa','C05_rara','E09'];
const PN=[...new Set([...POSE_OF,'E02','G06'])];
const BLINKP=['C01','E01'];
const RH=830, RB=1180, ACT_W=980, ACT_H=1000;
// K (kit) -> pose C01, medido por correlação (blink_gen.py): px da pose = (px K - origem) * KS + offset
const KS_=0.62, KOX=165, KOY=270, KPX=71, KPY=159, C01W=386, C01H=1211;
const BUSTW=723, BUSTH=1247, EYEK=[375,365];
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);
const lerp=(a,b,p)=>a+(b-a)*p;
const eoE=p=>p>=1?1:1-Math.pow(2,-10*p);
const eio=p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;
const bk=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const sstep=(a,b,x)=>{const p=clamp((x-a)/(b-a));return p*p*(3-2*p)};
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function mk(cls){const d=document.createElement('div');d.className=cls;return d}
// ---------- imagens ----------
const PIMG={};
PN.forEach(n=>{const i=new Image();i.src='../recortes/'+n+'.png';PIMG[n]=i});
BLINKP.forEach(n=>{const i=new Image();i.src='../recortes/blink/'+n+'_blink.png';PIMG[n+'_b']=i});
const poseScale=n=>(n.startsWith('C05')?740:RH)/PIMG[n].naturalHeight;
const CL=window.CLIPS;
Object.keys(CL).forEach(id=>{const c=CL[id];c.imgs=c.frames.map(f=>{const i=new Image();i.src='../grupo4_reel/ia/'+c.dir+'/'+f;return i})});
// ---------- simulação por molas (spring) ----------
// Todo movimento da Rara sai daqui: m*a = -k(x-alvo) - c*v, damping 12 a 15, massa 0,6 a 0,8.
const SIMHZ=480,NS=Math.ceil(TOT*SIMHZ)+2;
const P_Y={k:100,m:0.7,c:12},P_X={k:100,m:0.8,c:12},P_XS={k:10,m:0.8,c:5.5},P_Q={k:150,m:0.6,c:13},P_R={k:100,m:0.7,c:12},P_C={k:30,m:0.8,c:9};
const EV=[];const ev=(t,f)=>EV.push([t,f]);
const SWAPS=[];   // [t, pose, tipo]
const HOLDGAIN={};
function peakFor(hold){ // calibra a altura do alvo para o pico real do pulo ser h (com mola subamortecida)
  if(HOLDGAIN[hold])return HOLDGAIN[hold];let y=0,v=0,pk=0,pkt=0;const dt=1/SIMHZ;
  for(let i=0;i<SIMHZ*1.2;i++){const t=i*dt,tg=t<hold?1:0;const a=(-P_Y.k*(y-tg)-P_Y.c*v)/P_Y.m;v+=a*dt;y+=v*dt;if(y>pk){pk=y;pkt=t}}
  return HOLDGAIN[hold]={g:1/pk,tp:pkt}}
let LEAN=1;
function hop(tl,h,dx,opt={}){const hold=opt.hold||0.16,ant=opt.ant||0.1,pf=peakFor(hold);
  if(opt.apex!==undefined)tl=opt.apex-pf.tp;          // ancora o ápice (onde a pose troca) no tempo pedido
  const lean=dx?7:(LEAN=-LEAN)*3;
  ev(tl-ant,s=>{s.sqT=0.08});
  ev(tl,s=>{s.sqT=-0.06;s.yT=h*pf.g;s.rT=lean;if(dx){s.xT+=dx;s.px=P_X}});
  ev(tl+hold+0.08,s=>{s.rT=0});
  ev(tl+hold,s=>{s.yT=0});
  ev(tl+hold+0.05,s=>{s.sqT=0});
  if(dx)ev(tl+hold+0.35,s=>{s.px=P_XS;s.xT=0});   // volta devagar (mola mole), sem varrer a tela
  if(opt.swap)SWAPS.push([tl+pf.tp,opt.swap,opt.kind||'hop']);
  return tl+pf.tp}
// ---- roteiro de ações (tempos em s, grade de 120 BPM) ----
const tS=[3.0,4.0,5.0,6.0];for(let i=4;i<16;i++)tS.push(7.0+(i-4)*0.5);
SWAPS.push([0,'C01','init']);
// seção A: ação atravessa o corte, sempre da esquerda para a direita
hop(0,150,120,{apex:4.10,swap:'E01'});               // EN -> ES, atravessa o whip pan
hop(0,170,120,{apex:4.88,swap:'E02',hold:0.2});      // ES -> FR, atravessa o zoom pela letra O
ev(5.70,s=>{s.px=P_X;s.xT+=110});ev(6.15,s=>{s.px=P_XS;s.xT=0}); // FR -> DE: o salto do clipe avança pelo corte da máscara
SWAPS.push([6.52,'G06','turn']);
hop(0,150,120,{apex:7.04,swap:'G01'});               // DE -> IT, atravessa a rotação
// seção B: um pulo por batida, pose nova no ápice (escondida pelo desfoque ou pelo giro)
const hB=[110,80,130,90,120,85,140,95,125,100,135,90];
for(let i=5;i<16;i++){const ts=tS[i];hop(0,hB[i-4],0,{apex:ts+0.03,ant:0.1,swap:POSE_OF[i],kind:(i%3==1?'turn':'hop')})}
// boom e cartão final
hop(0,130,0,{apex:13.10,swap:'E02'});
hop(13.50,200,0,{hold:0.34,ant:0.14});
hop(0,160,130,{apex:15.42,swap:'G06'});              // boom -> cartão, atravessa a passagem de luz
EV.sort((a,b)=>a[0]-b[0]);SWAPS.sort((a,b)=>a[0]-b[0]);
const SIM={x:new Float32Array(NS),y:new Float32Array(NS),sq:new Float32Array(NS),rot:new Float32Array(NS),vx:new Float32Array(NS),vy:new Float32Array(NS),cx:new Float32Array(NS),cy:new Float32Array(NS)};
(function runSim(){const s={x:0,vx:0,xT:0,px:P_X,y:0,vy:0,yT:0,sq:0,vsq:0,sqT:0,r:0,vr:0,rT:0,cx:0,vcx:0,cy:0,vcy:0};const dt=1/SIMHZ;let ei=0;
 for(let i=0;i<NS;i++){const t=i*dt;while(ei<EV.length&&EV[ei][0]<=t){EV[ei][1](s);ei++}
  let a=(-s.px.k*(s.x-s.xT)-s.px.c*s.vx)/s.px.m;s.vx+=a*dt;s.x+=s.vx*dt;
  a=(-P_Y.k*(s.y-s.yT)-P_Y.c*s.vy)/P_Y.m;s.vy+=a*dt;s.y+=s.vy*dt;
  if(s.y<0){if(s.vy<-30)s.vsq+=Math.min(-s.vy*0.0034,2.1);s.y=0;s.vy=0}
  a=(-P_Q.k*(s.sq-s.sqT)-P_Q.c*s.vsq)/P_Q.m;s.vsq+=a*dt;s.sq+=s.vsq*dt;
  a=(-P_R.k*(s.r-s.rT)-P_R.c*s.vr)/P_R.m;s.vr+=a*dt;s.r+=s.vr*dt;
  // câmera segue com atraso de mola
  const tx=s.x*0.55,ty=s.y*0.35;
  a=(-P_C.k*(s.cx-tx)-P_C.c*s.vcx)/P_C.m;s.vcx+=a*dt;s.cx+=s.vcx*dt;
  a=(-P_C.k*(s.cy-ty)-P_C.c*s.vcy)/P_C.m;s.vcy+=a*dt;s.cy+=s.vcy*dt;
  SIM.x[i]=s.x;SIM.y[i]=s.y;SIM.sq[i]=clamp(s.sq,-0.10,0.10);SIM.rot[i]=s.r;SIM.vx[i]=s.vx;SIM.vy[i]=s.vy;SIM.cx[i]=s.cx;SIM.cy[i]=s.cy}})();
function simAt(arr,t){const f=clamp(t,0,TOT)*SIMHZ,i=Math.floor(f),a=f-i;return arr[i]*(1-a)+arr[Math.min(i+1,NS-1)]*a}
// piscadas em intervalos aleatórios de 2 a 5 s (semente fixa), 120 ms, K03 / variante com olhos fechados
const BLINKS=(()=>{const r=rng(2026);const a=[];let t=1.9;while(t<TOT){t+=2+r()*3;a.push(t)}a[0]=4.36;return a})();
const isBlink=t=>BLINKS.some(b=>t>=b&&t<b+0.12);
// clipes de IA (trechos aproveitados): [id, t0 no vídeo final, t1, início no clipe (s)]
const CLIPUSE=[['c1',2.30,3.70,0.50],['c2',4.98,6.36,0.05],['c3',15.50,17.5,0.20]];
function clipAt(t){for(const [id,a,b,o] of CLIPUSE){const c=CL[id];if(!c)continue;if(t>=a&&t<b){const e=Math.min(clamp((t-a)/0.07),clamp((b-t)/0.10));return{id,src:o+(t-a),alpha:e}}}return null}
// ---------- estado da Rara em t ----------
function actorState(t){
 const lag=0.06,tl=Math.max(t-lag,0);
 let pose='C01';for(const [ts,p] of SWAPS){if(ts<=t&&p)pose=p}
 // efeito de troca: desfoque vertical no ápice (hop) ou giro rápido (turn)
 let by=0,sx=1;for(const [ts,p,k] of SWAPS){if(!p||k==='init')continue;const d=Math.abs(t-ts);if(d<0.07){const a=1-d/0.07;if(k==='turn'){sx=1-0.9*a}else{by=Math.max(by,26*a)}}}
 const ph=(t%BEAT)/BEAT,bob=2.6*Math.exp(-ph*5);
 const vx=simAt(SIM.vx,tl),vy=simAt(SIM.vy,tl);
 const crest=clamp(-vx*0.05+Math.sin(t*2.1)*2.2,-26,26), tail=clamp(-vx*0.085+Math.sin(t*1.5+1)*4,-48,48);
 const clip=clipAt(t);
 const hasB=BLINKP.includes(pose);
 return{pose,x:simAt(SIM.x,t),y:simAt(SIM.y,t),sq:simAt(SIM.sq,t),rot:simAt(SIM.rot,t)+1.5*Math.sin(2*Math.PI*t/3),
  breath:1+0.015*Math.sin(2*Math.PI*t/2.4),by,sx,bob,crest,tail,clip,blink:hasB&&isBlink(t),cx:simAt(SIM.cx,t),cy:simAt(SIM.cy,t)}}
// ---------- desenho da Rara (canvas, linha a linha: topete, cabeça e cauda deformam) ----------
function mkActor(sc,host){const cv=document.createElement('canvas');cv.className='cv';cv.width=Math.round(ACT_W*DPR);cv.height=Math.round(ACT_H*DPR);
 cv.style.cssText=`left:${540-ACT_W/2}px;top:${RB-ACT_H}px;width:${ACT_W}px;height:${ACT_H}px;transform-origin:50% 100%`;
 const sh=mk('shd');sh.style.cssText=`left:${540-290}px;top:${RB-30}px;width:580px;height:64px`;host.appendChild(sh);host.appendChild(cv);sc.cv=cv;sc.shd=sh;return cv}
function drawActor(cv,A){const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(DPR,0,0,DPR,0,0);
 const cp=A.clip;
 if(cp){const c=CL[cp.id];const k=clamp(cp.src*c.fps,0,c.n-1.001),i0=Math.floor(k),a=k-i0;const f=c.f;
  const dr=(im,al)=>{if(!im.complete||!im.naturalWidth)return;ctx.globalAlpha=al;ctx.drawImage(im,ACT_W/2+(c.ox-c.gx)*f,ACT_H+(c.oy-c.gy)*f,im.naturalWidth*f,im.naturalHeight*f)};
  if(cp.alpha<1){ctx.globalAlpha=1}
  const base=A.clip.alpha;
  // sob o clipe fica a pose, para o fade de entrada e saída
  if(base<1)drawPose(ctx,A,1-base);
  const a2=clamp((a-0.4)/0.2);ctx.globalAlpha=base;dr(c.imgs[i0],base);if(a2>0.02)dr(c.imgs[i0+1],a2*base);ctx.globalAlpha=1;return}
 drawPose(ctx,A,1)}
function drawPose(ctx,A,alpha){const nm=A.pose,img=(A.blink&&PIMG[nm+'_b'])?PIMG[nm+'_b']:PIMG[nm];if(!img||!img.naturalWidth)return;
 const ps=poseScale(nm),w=img.naturalWidth,h=img.naturalHeight,x0=ACT_W/2-w*ps/2,top=ACT_H-h*ps;ctx.globalAlpha=alpha;
 if(nm.startsWith('C05')){ctx.drawImage(img,x0,top,w*ps,h*ps);ctx.globalAlpha=1;return}
 const B=3;const yH0=0.26*h,yH1=0.38*h,yC=0.13*h,yT0=0.62*h;
 const blk=(sy,sh,dx,dy)=>ctx.drawImage(img,0,sy,w,sh,x0+dx,top+sy*ps+dy,w*ps,sh*ps+0.7);
 // cabeça + topete: dy (cabeça acompanha a batida) e dx (topete atrasado)
 const yEnd=Math.round(yH1);
 for(let y=0;y<yEnd;y+=B){const yc=y+B/2;const wh=1-sstep(yH0,yH1,yc);const wc=yc<yC?Math.pow((yC-yc)/yC,1.4):0;blk(y,Math.min(B,yEnd-y),A.crest*wc,A.bob*wh)}
 // tronco inteiro sem deformação
 const yT=Math.round(yT0);blk(yEnd,yT-yEnd,0,0);
 // cauda: curva com o atraso
 for(let y=yT;y<h;y+=B){const yc=y+B/2;const wt=Math.pow((yc-yT0)/(h-yT0),2);blk(y,Math.min(B,h-y),A.tail*wt,0)}
 ctx.globalAlpha=1}
function placeActor(sc,A){const sxx=A.sx*(1+A.sq*0.6),syy=(1-A.sq)*A.breath;
 sc.cv.style.transform=`translate(${A.x}px,${-A.y}px) rotate(${A.rot}deg) scale(${sxx},${syy})`;
 sc.cv.style.filter=A.by>0.4?'url(#by)':'none';
 const hs=clamp(1-A.y/520,0.25,1);sc.shd.style.transform=`translateX(${A.x}px) scale(${hs})`;sc.shd.style.opacity=0.28+0.5*hs-0.28;
 drawActor(sc.cv,A)}
// ---------- cenas ----------
const SC=[];const host=$('scenes');
function layer(sc,name,z){const l=mk('ly');l.style.zIndex=z;sc.appendChild(l);sc[name]=l;return l}
function addCircles(l,c){l.innerHTML=`<div class="ly" style="background:linear-gradient(170deg,${c[0]},${c[1]})"></div><div class="circ" style="width:1000px;height:1000px;left:-340px;top:260px"></div><div class="circ" style="width:1100px;height:1100px;left:380px;top:1000px"></div>`}
function feathers(l,seed,n=11){const r=rng(seed);const cols=['#2457E6','#22B5A8','#FFC83D','#22B573'];let h='';for(let i=0;i<n;i++){const c=cols[Math.floor(r()*4)];const s=60+r()*90;h+=`<svg class="fe" data-x="${r()*1080}" data-y="${r()*2200}" data-v="${40+r()*70}" data-r="${r()*360}" data-w="${(r()-.5)*90}" data-b="${i%3==0?0:1}" width="${s*.5}" height="${s}" viewBox="-20 -150 40 150" style="position:absolute;left:0;top:0"><path d="M0,0 C22,-32 30,-95 0,-148 C-30,-95 -22,-32 0,0Z" fill="${c}"/><path d="M0,0 L0,-140" stroke="rgba(255,255,255,.55)" stroke-width="2"/></svg>`}
 for(let i=0;i<8;i++){const s=40+r()*110;h+=`<div class="fe" data-x="${r()*1080}" data-y="${r()*2200}" data-v="${30+r()*50}" data-r="0" data-w="0" data-b="2" style="position:absolute;left:0;top:0;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)"></div>`}
 l.innerHTML=h}
function buildLang(i){const sc=mk('sc');const [w,g,sub,font]=L[i];sc.kind='lang';sc.idx=i;sc.font=font;
 const bgc=i<4?BG[i]:BG[((i-4)%6)];sc.bgc=bgc;
 const lb=layer(sc,'ly0',1);addCircles(lb,bgc);
 const lf=layer(sc,'ly1',2);const rows=[0,1,2,3,4].map(r=>`<div class="row" data-d="${r%2?1:-1}" data-b="${(r*173)%420}" style="top:${150+r*262}px;font-size:${font==='NSC'||font==='NJP'||font==='NKR'?230:215}px;line-height:260px;font-family:'${font}','Nunito';direction:${font==='NAr'||font==='NHe'?'rtl':'ltr'}">${(`<span>${w}</span>`).repeat(8)}</div>`).join('');
 lf.innerHTML=`<div style="position:absolute;inset:0;opacity:.25;filter:blur(9px);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 1020px,transparent 1130px)">${rows}</div>`;
 // palavra gigante ATRÁS da Rara, nítida, centrada na altura do corpo
 const lm=layer(sc,'ly2',3);const fs=clamp(1000/(w.length*.64),150,430);sc.midfs=fs;
